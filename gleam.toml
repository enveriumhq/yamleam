name = "yamleam"
version = "1.3.0"
target = "erlang"
gleam = ">= 1.9.0"

description = "A pure-Gleam YAML 1.2 parser with gleam_json-style decoders."

licences = ["Apache-2.0"]

repository = { type = "github", user = "enveriumhq", repo = "yamleam" }
links = [
  { title = "Repository", href = "https://github.com/enveriumhq/yamleam" },
  { title = "Roadmap", href = "https://github.com/enveriumhq/yamleam/blob/main/ROADMAP.md" },
  { title = "Enverium", href = "https://enverium.com" },
]

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
